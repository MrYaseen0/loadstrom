<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Sign In</title>
<link rel="icon" href="/logo.png">
<style>
  :root{
    --bg:#0b0d12; --card:#141821; --muted:#9aa3b2; --txt:#eef1f6;
    --accent:#ff6a00; --accent2:#ffb300; --danger:#ff5d5d; --ring:rgba(255,106,0,.35);
    --spring:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--txt);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1a1410 0%, var(--bg) 55%), var(--bg);
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:520px){
    body{align-items:center; padding:24px}
  }
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.8);
    opacity:0; animation:fadeIn .3s ease forwards;
  }
  @keyframes fadeIn{to{opacity:1}}
  .sheet{
    position:relative; width:100%; max-width:400px;
    background:var(--card); border:1px solid rgba(255,255,255,.07);
    border-bottom:0; border-radius:18px 18px 0 0;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
    opacity:0; transform:translateY(48px) scale(.98);
    animation:sheetUp .45s var(--spring) forwards;
    max-height:92svh; overflow:hidden;
  }
  @media (min-width:520px){
    .sheet{border-bottom:1px solid rgba(255,255,255,.07); border-radius:22px}
  }
  @keyframes sheetUp{to{opacity:1; transform:translateY(0) scale(1)}}
  .grabber{width:100px; height:8px; border-radius:999px; background:rgba(255,255,255,.14); margin:14px auto 0}
  @media (min-width:520px){.grabber{display:none}}
  .head{display:flex; align-items:center; justify-content:center; padding:18px 24px 4px; position:relative}
  .head h1{font-size:20px; font-weight:600; letter-spacing:-.2px; margin:0; user-select:none}
  .logo-wrap{display:flex; justify-content:center; padding:20px 24px 0; min-height:64px}
  .logo-wrap img{max-width:230px; max-height:84px; object-fit:contain; filter:drop-shadow(0 4px 18px rgba(255,106,0,.25))}
  .viewport{overflow:hidden; transition:height .4s var(--spring); will-change:height}
  .steps{position:relative}
  .step{padding:18px 24px 26px}
  .step.signing{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:280px}
  .step{transition:opacity .3s var(--spring), transform .3s var(--spring)}
  .steps[data-active="signing"] .step.form{opacity:0; transform:scale(.96); pointer-events:none; position:absolute; inset:0}
  .steps[data-active="form"] .step.signing{opacity:0; transform:scale(.96); pointer-events:none}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 6px}
  label.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
  .field{position:relative}
  .field svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); pointer-events:none}
  input{
    width:100%; height:48px; border-radius:16px; border:1px solid transparent;
    background:#0e1219; color:var(--txt); padding:0 16px 0 42px; font-size:15px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--ring)}
  button.primary{
    width:100%; height:48px; margin-top:18px; border:0; border-radius:16px; cursor:pointer;
    font-size:15px; font-weight:700; color:#16100a;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    transition:transform .08s, filter .15s;
  }
  button.primary:hover{filter:brightness(1.07)}
  button.primary:active{transform:scale(.95)}
  button.primary:disabled{opacity:.6; cursor:wait; transform:none}
  .error{
    display:none; margin-top:14px; padding:10px 12px; border-radius:12px; font-size:13.5px;
    background:rgba(255,93,93,.1); border:1px solid rgba(255,93,93,.35); color:#ffb4b4;
  }
  .error.show{display:block}
  .shake{animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .spinner{position:relative; width:104px; height:104px; display:flex; align-items:center; justify-content:center}
  .spinner .beam{
    position:absolute; left:-50%; top:-50%; width:200%; height:200%;
    background:conic-gradient(from 0deg, transparent 0%, #4DAFFE 10%, #4DAFFE 25%, transparent 35%);
    animation:spin 1.25s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner .clip{position:absolute; inset:0; overflow:hidden; border-radius:22px}
  .spinner .core{
    position:relative; z-index:1; width:88px; height:88px; border-radius:18px;
    background:var(--card); display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.07);
  }
  .spinner .core svg{width:34px; height:34px; color:var(--txt)}
  .status{color:var(--muted); font-size:14px; margin:0}
  @media (prefers-reduced-motion:reduce){
    .overlay,.sheet{animation-duration:.01s}
    .viewport,.step,button.primary{transition-duration:.01s}
    .spinner .beam{animation:none}
    .shake{animation:none}
  }
</style>
</head>
<body>
  <div class="overlay"></div>
  <main class="sheet" aria-label="Sign in">
    <div class="grabber"></div>
    <div class="logo-wrap">
      <img src="/logo.png" alt="" onerror="this.remove()">
    </div>
    <div class="head"><h1>Sign In</h1></div>
    <div class="viewport" id="viewport">
      <div class="steps" id="steps" data-active="form">
        <section class="step form" aria-label="Credentials">
          <form id="loginForm" autocomplete="off">
            <label class="sr" for="username">Username</label>
            <div class="field">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
              <input id="username" name="username" type="text" autocomplete="username" required maxlength="256" placeholder="Username">
            </div>
            <label class="sr" for="password">Password</label>
            <div class="field" style="margin-top:12px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.5-8.5"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Password">
            </div>
            <button id="signInBtn" class="primary" type="submit">Sign In</button>
            <div id="err" class="error" role="alert"></div>
          </form>
        </section>
        <section class="step signing" aria-label="Signing in">
          <div class="spinner" aria-hidden="true">
            <div class="clip"><div class="beam"></div></div>
            <div class="core">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m10.85 12.15 8.5-8.5"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg>
            </div>
          </div>
          <p class="status">Signing in</p>
        </section>
      </div>
    </div>
  </main>
<script>
(function () {
  var steps = document.getElementById('steps');
  var viewport = document.getElementById('viewport');
  var form = document.getElementById('loginForm');
  var userEl = document.getElementById('username');
  var passEl = document.getElementById('password');
  var btn = document.getElementById('signInBtn');
  var err = document.getElementById('err');
  var sheet = document.querySelector('.sheet');

  function activePanel() {
    return steps.getAttribute('data-active') === 'signing'
      ? steps.querySelector('.step.signing')
      : steps.querySelector('.step.form');
  }
  function fitHeight() {
    viewport.style.height = activePanel().offsetHeight + 'px';
  }
  function showStep(name) {
    steps.setAttribute('data-active', name);
    fitHeight();
  }
  function showError(msg) {
    err.textContent = msg;
    err.classList.add('show');
    sheet.classList.remove('shake');
    void sheet.offsetWidth;
    sheet.classList.add('shake');
    fitHeight();
  }

  fetch('/api/auth-status', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && (d.authed || !d.authEnabled)) window.location.replace('/');
    })
    .catch(function () {});
  userEl.focus();
  fitHeight();
  window.addEventListener('resize', fitHeight);

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.classList.remove('show');
    btn.disabled = true;
    showStep('signing');
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: userEl.value, password: passEl.value }),
    })
      .then(function (r) {
        if (r.status === 200) { window.location.replace('/'); return null; }
        return r.json().then(function (d) {
          throw new Error((d && d.error) || 'Sign-in failed.');
        });
      })
      .catch(function (e) {
        passEl.value = '';
        showStep('form');
        showError(/failed to fetch|networkerror/i.test(e.message)
          ? 'Cannot reach the server.'
          : e.message);
      })
      .then(function () {
        setTimeout(function () {
          btn.disabled = false;
          passEl.focus();
        }, 600);
      });
  });
})();
</script>
</body>
</html>
